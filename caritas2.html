<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>caritas – avatar facial reactivo ético</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #1e1e2f; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 0.5rem; margin: 0; min-height: 100vh; }
        h2 { margin: 0.5rem 0 0; }
        p { margin: 0.2rem 0 0.5rem; font-size: 0.9rem; }
        canvas { border: 1px solid #444; border-radius: 50%; background: #2a2a3c; margin: 0.5rem 0; max-width: 100%; height: auto; }
        textarea { width: 100%; max-width: 400px; padding: 0.5rem; border-radius: 8px; border: none; background: #333; color: white; resize: vertical; font-size: 1rem; }
        .buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; margin: 0.4rem 0; }
        button { padding: 0.7rem 1.4rem; border: none; border-radius: 24px; background: #4a4a8a; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; min-width: 44px; min-height: 44px; }
        button:hover { background: #6a6aaa; }
        button:disabled { opacity: 0.5; pointer-events: none; }
        .emotion-btns button { font-size: 1.8rem; padding: 0.3rem 0.7rem; border-radius: 50%; min-width: 48px; min-height: 48px; }
        #btnParar { background: #8a4a4a; }
        #btnParar:hover { background: #aa6a6a; }
        .config-panel { background: #2a2a3c; padding: 0.8rem; border-radius: 12px; margin-top: 0.5rem; max-width: 400px; width: 100%; }
        .config-panel label { display: block; margin: 0.4rem 0; font-size: 0.9rem; }
        .config-panel input[type=range], .config-panel select { width: 100%; }
        summary { cursor: pointer; margin-bottom: 0.5rem; }
        #aviso-unico { background: #3a3a5a; padding: 0.6rem; border-radius: 8px; margin: 0.3rem 0; text-align: center; font-size: 0.8rem; color: #ccc; }
        @media (max-width: 400px) {
            .emotion-btns button { font-size: 1.5rem; min-width: 40px; min-height: 40px; }
        }
    </style>
</head>
<body>
    <h2>😸 caritas</h2>
    <p>Avatar que habla con tu tono</p>

    <div id="aviso-unico">Este asistente genera voz y expresión sintética. No es una persona real.</div>

    <canvas id="cara" width="280" height="280"></canvas>

    <textarea id="texto" rows="4" placeholder="Escribe o pega texto...">Hola, me siento genial hoy.</textarea>

    <div class="buttons">
        <button id="btnHablar" onclick="hablarCaritas()">🗣️ Hablar</button>
        <button id="btnNarrar" onclick="narrarTexto()">📖 Narrar</button>
        <button id="btnParar" onclick="pararNarracion()" style="display:none;">⏹️ Parar</button>
    </div>

    <div class="buttons emotion-btns" id="emocionesManuales">
        <button onclick="setEmocionManual('positivo', this)" title="Alegre">😊</button>
        <button onclick="setEmocionManual('negativo', this)" title="Triste">😢</button>
        <button onclick="setEmocionManual('neutro', this)" title="Neutro">😐</button>
        <button onclick="setEmocionManual('sorpresa', this)" title="Sorpresa">😮</button>
        <button onclick="setEmocionManual('enfado', this)" title="Enfado">😠</button>
        <button onclick="setEmocionManual('automatico', this)" title="Automático">🤖 Auto</button>
    </div>

    <details class="config-panel">
        <summary>⚙️ Configuración</summary>
        <label>Velocidad base: <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></label>
        <label>Tono base (pitch): <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1"></label>
        <label>Umbral sentimiento (+): <input type="range" id="umbralPos" min="0" max="5" value="1"></label>
        <label>Voz: <select id="selectorVoces"></select></label>
        <button onclick="guardarConfig()">Guardar</button>
    </details>

    <script>
        // ====================== ESTADO GLOBAL ======================
        const canvas = document.getElementById('cara');
        const ctx = canvas.getContext('2d');

        // Configuración
        let config = { rate: 1.0, pitch: 1.0, umbralPositivo: 1, voz: null };

        // Emoción manual / automática
        let emocionManual = 'automatico';

        // Narración
        let narrando = false;
        let listaFragmentos = [];
        let indiceFragmentoActual = 0;

        // Transición suave de expresión
        let emocionActual = 'neutro';      // lo que se está mostrando
        let emocionObjetivo = 'neutro';    // a lo que se quiere llegar
        let tiempoInicioTransicion = 0;
        const DURACION_TRANSICION = 250;   // ms

        // Boca hablando
        let bocaAbierta = false;

        // ====================== LÉXICO PONDERADO ======================
        const lexicon = {
            'genial':     { tipo: 'positivo', peso: 2 },
            'bien':       { tipo: 'positivo', peso: 1 },
            'feliz':      { tipo: 'positivo', peso: 2 },
            'alegre':     { tipo: 'positivo', peso: 2 },
            'amor':       { tipo: 'positivo', peso: 2 },
            'gracias':    { tipo: 'positivo', peso: 1 },
            'maravilloso':{ tipo: 'positivo', peso: 3 },
            'estupendo':  { tipo: 'positivo', peso: 2 },
            'fantástico': { tipo: 'positivo', peso: 2 },
            'triste':     { tipo: 'negativo', peso: 2 },
            'mal':        { tipo: 'negativo', peso: 1 },
            'peor':       { tipo: 'negativo', peso: 2 },
            'odio':       { tipo: 'negativo', peso: 3 },
            'horrible':   { tipo: 'negativo', peso: 3 },
            'pena':       { tipo: 'negativo', peso: 2 },
            'fatal':      { tipo: 'negativo', peso: 2 },
            'terrible':   { tipo: 'negativo', peso: 2 },
            'asco':       { tipo: 'negativo', peso: 2 },
            'sorpresa':   { tipo: 'sorpresa', peso: 1 },
            'increíble':  { tipo: 'sorpresa', peso: 2 },
            'guau':       { tipo: 'sorpresa', peso: 2 },
            'vaya':       { tipo: 'sorpresa', peso: 1 },
            'ostras':     { tipo: 'sorpresa', peso: 1 },
            'asombroso':  { tipo: 'sorpresa', peso: 2 },
            'enfadado':   { tipo: 'enfado',   peso: 2 },
            'furioso':    { tipo: 'enfado',   peso: 3 },
            'rabia':      { tipo: 'enfado',   peso: 2 },
            'cabreado':   { tipo: 'enfado',   peso: 2 },
            'indignado':  { tipo: 'enfado',   peso: 2 },
        };

        // ====================== ANÁLISIS DE SENTIMIENTO ======================
        function analizarSentimiento(texto) {
            if (emocionManual !== 'automatico') return emocionManual;

            let puntuaciones = { positivo: 0, negativo: 0, sorpresa: 0, enfado: 0 };
            const tokens = texto.toLowerCase().split(/[^a-záéíóúüñ]+/);
            const tokensOriginales = texto.split(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+/); // para detectar mayúsculas

            tokens.forEach((token, idx) => {
                if (lexicon[token]) {
                    let peso = lexicon[token].peso;
                    // Si la palabra original está en mayúsculas, aumentamos peso
                    if (tokensOriginales[idx] && tokensOriginales[idx] === tokensOriginales[idx].toUpperCase() && tokensOriginales[idx].length > 1) {
                        peso *= 1.5;
                    }
                    puntuaciones[lexicon[token].tipo] += peso;
                }
            });

            // Elegir la emoción con mayor puntuación (mínimo 1)
            let maxTipo = 'neutro';
            let maxPeso = 0;
            for (let tipo in puntuaciones) {
                if (puntuaciones[tipo] > maxPeso) {
                    maxPeso = puntuaciones[tipo];
                    maxTipo = tipo;
                }
            }
            return maxPeso >= 1 ? maxTipo : 'neutro';
        }

        // ====================== TRANSICIÓN SUAVE DE EMOCIÓN ======================
        function setEmocion(nuevaEmocion) {
            if (emocionObjetivo === nuevaEmocion) return;
            emocionObjetivo = nuevaEmocion;
            if (emocionActual !== nuevaEmocion) {
                tiempoInicioTransicion = performance.now();
            }
        }

        function actualizarTransicion() {
            if (emocionActual === emocionObjetivo) return;
            const ahora = performance.now();
            if (ahora - tiempoInicioTransicion >= DURACION_TRANSICION) {
                emocionActual = emocionObjetivo;
            }
        }

        // ====================== DIBUJO DE LA CARA ======================
        function dibujarCara() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = Math.min(canvas.width, canvas.height) * 0.4;  // radio cabeza

            // Cabeza
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#ccc';
            ctx.stroke();

            const emocion = emocionActual;
            const ojoY = cy - r * 0.55;
            const ojoOffsetX = r * 0.45;
            const cejaY = ojoY - r * 0.3;
            const bocaY = cy + r * 0.45;
            const bocaAncho = r * 0.45;
            const bocaAlto = r * 0.2;

            // Ojos (siempre semicírculos)
            ctx.beginPath();
            ctx.arc(cx - ojoOffsetX, ojoY, r * 0.1, 0, Math.PI, false);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + ojoOffsetX, ojoY, r * 0.1, 0, Math.PI, false);
            ctx.stroke();

            // Cejas según emoción
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            if (emocion === 'positivo') {
                ctx.moveTo(cx - ojoOffsetX - 15, cejaY);
                ctx.quadraticCurveTo(cx - ojoOffsetX, cejaY - 10, cx - ojoOffsetX + 15, cejaY);
                ctx.moveTo(cx + ojoOffsetX + 15, cejaY);
                ctx.quadraticCurveTo(cx + ojoOffsetX, cejaY - 10, cx + ojoOffsetX - 15, cejaY);
            } else if (emocion === 'negativo') {
                ctx.moveTo(cx - ojoOffsetX - 15, cejaY + 5);
                ctx.lineTo(cx - ojoOffsetX + 15, cejaY);
                ctx.moveTo(cx + ojoOffsetX + 15, cejaY + 5);
                ctx.lineTo(cx + ojoOffsetX - 15, cejaY);
            } else if (emocion === 'sorpresa') {
                ctx.moveTo(cx - ojoOffsetX - 15, cejaY - 8);
                ctx.quadraticCurveTo(cx - ojoOffsetX, cejaY - 18, cx - ojoOffsetX + 15, cejaY - 8);
                ctx.moveTo(cx + ojoOffsetX + 15, cejaY - 8);
                ctx.quadraticCurveTo(cx + ojoOffsetX, cejaY - 18, cx + ojoOffsetX - 15, cejaY - 8);
            } else if (emocion === 'enfado') {
                ctx.moveTo(cx - ojoOffsetX - 18, cejaY);
                ctx.lineTo(cx - ojoOffsetX + 12, cejaY - 8);
                ctx.moveTo(cx + ojoOffsetX + 18, cejaY);
                ctx.lineTo(cx + ojoOffsetX - 12, cejaY - 8);
            } else {
                // neutro
                ctx.moveTo(cx - ojoOffsetX - 15, cejaY);
                ctx.lineTo(cx - ojoOffsetX + 15, cejaY);
                ctx.moveTo(cx + ojoOffsetX + 15, cejaY);
                ctx.lineTo(cx + ojoOffsetX - 15, cejaY);
            }
            ctx.stroke();

            // Boca
            ctx.beginPath();
            if (bocaAbierta) {
                ctx.ellipse(cx, bocaY, bocaAncho * 0.4, bocaAlto * 0.8, 0, 0, Math.PI * 2);
            } else {
                if (emocion === 'positivo') {
                    ctx.arc(cx, bocaY, bocaAncho * 0.6, 0, Math.PI, false);
                } else if (emocion === 'negativo') {
                    ctx.arc(cx, bocaY + bocaAlto * 0.7, bocaAncho * 0.6, Math.PI, 2 * Math.PI, false);
                } else if (emocion === 'sorpresa') {
                    ctx.arc(cx, bocaY, bocaAncho * 0.3, 0, Math.PI * 2);
                } else if (emocion === 'enfado') {
                    ctx.moveTo(cx - bocaAncho * 0.5, bocaY);
                    ctx.lineTo(cx + bocaAncho * 0.5, bocaY);
                } else {
                    ctx.moveTo(cx - bocaAncho * 0.5, bocaY);
                    ctx.lineTo(cx + bocaAncho * 0.5, bocaY);
                }
            }
            ctx.stroke();

            // Pupilas
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cx - ojoOffsetX, ojoY + 2, r * 0.05, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + ojoOffsetX, ojoY + 2, r * 0.05, 0, Math.PI * 2); ctx.fill();

            // Marca de agua ética INCRUSTADA
            ctx.font = `${r*0.12}px sans-serif`;
            ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
            ctx.fillText('🤖 IA', 8, 20);
        }

        // Bucle de animación para transiciones y boca
        function loopAnimacion() {
            actualizarTransicion();
            dibujarCara();
            requestAnimationFrame(loopAnimacion);
        }

        // ====================== SÍNTESIS DE VOZ ======================
        function crearUtterance(texto, emocion) {
            const utterance = new SpeechSynthesisUtterance(texto);
            let rate = config.rate;
            let pitch = config.pitch;
            switch (emocion) {
                case 'positivo': pitch *= 1.4; rate *= 1.25; break;
                case 'negativo': pitch *= 0.7; rate *= 0.8; break;
                case 'sorpresa': pitch *= 1.6; rate *= 1.4; break;
                case 'enfado': pitch *= 0.8; rate *= 1.3; break;
            }
            utterance.rate = rate;
            utterance.pitch = pitch;
            if (config.voz) utterance.voice = config.voz;
            return utterance;
        }

        // Función unificada que corta cualquier conversación previa y lanza una nueva
        function iniciarHabla(texto, esNarracion = false) {
            // Cancelar cualquier síntesis activa
            speechSynthesis.cancel();
            if (!esNarracion) {
                // Si es una nueva conversación simple, detenemos la narración en curso
                if (narrando) finalizarNarracion();
            }

            const emocion = analizarSentimiento(texto);
            setEmocion(emocion);   // inicia transición visual

            const utterance = crearUtterance(texto, emocion);
            let intervalo;

            utterance.onstart = () => {
                intervalo = setInterval(() => {
                    bocaAbierta = !bocaAbierta;
                }, 120);
            };

            utterance.onend = () => {
                clearInterval(intervalo);
                bocaAbierta = false;
                if (esNarracion && narrando) {
                    indiceFragmentoActual++;
                    if (indiceFragmentoActual < listaFragmentos.length) {
                        iniciarHabla(listaFragmentos[indiceFragmentoActual], true);
                    } else {
                        finalizarNarracion();
                    }
                }
            };

            utterance.onerror = () => {
                clearInterval(intervalo);
                bocaAbierta = false;
                if (esNarracion) finalizarNarracion();
            };

            speechSynthesis.speak(utterance);
        }

        // ====================== ACCIONES DE BOTONES ======================
        function hablarCaritas() {
            const texto = document.getElementById('texto').value.trim();
            if (texto === '' || narrando) return;
            iniciarHabla(texto, false);
        }

        function narrarTexto() {
            const textoCompleto = document.getElementById('texto').value.trim();
            if (textoCompleto === '' || narrando) return;

            const fragmentos = textoCompleto.match(/[^.!?¡¿]+[.!?¡¿]*/g) || [textoCompleto];
            listaFragmentos = fragmentos.map(f => f.trim()).filter(f => f !== '');
            if (listaFragmentos.length === 0) return;

            indiceFragmentoActual = 0;
            narrando = true;
            document.getElementById('btnHablar').disabled = true;
            document.getElementById('btnNarrar').disabled = true;
            document.getElementById('btnParar').style.display = 'inline-block';
            iniciarHabla(listaFragmentos[0], true);
        }

        function pararNarracion() {
            speechSynthesis.cancel();
            finalizarNarracion();
        }

        function finalizarNarracion() {
            narrando = false;
            bocaAbierta = false;
            document.getElementById('btnHablar').disabled = false;
            document.getElementById('btnNarrar').disabled = false;
            document.getElementById('btnParar').style.display = 'none';
        }

        // ====================== EMOCIONES MANUALES ======================
        function setEmocionManual(emocion, element) {
            emocionManual = emocion;
            const botones = document.querySelectorAll('.emotion-btns button');
            botones.forEach(b => b.style.background = '#4a4a8a');
            if (element) element.style.background = '#8a4a8a';
            // Si se selecciona una emoción manual, la aplicamos directamente
            if (emocion !== 'automatico') {
                setEmocion(emocion);
            }
        }

        // ====================== CONFIGURACIÓN ======================
        function cargarVoces() {
            const selector = document.getElementById('selectorVoces');
            selector.innerHTML = '';
            const voces = speechSynthesis.getVoices();
            const vocesFiltradas = voces.filter(v => v.lang.startsWith('es')) || voces;
            (vocesFiltradas.length ? vocesFiltradas : voces).forEach(voz => {
                const option = document.createElement('option');
                option.value = voz.name;
                option.textContent = `${voz.name} (${voz.lang})`;
                selector.appendChild(option);
            });
            if (config.voz) {
                const index = [...selector.options].findIndex(opt => opt.value === config.voz.name);
                if (index >= 0) selector.selectedIndex = index;
            }
        }

        function guardarConfig() {
            config.rate = parseFloat(document.getElementById('rate').value);
            config.pitch = parseFloat(document.getElementById('pitch').value);
            config.umbralPositivo = parseInt(document.getElementById('umbralPos').value);
            const selector = document.getElementById('selectorVoces');
            const nombreVoz = selector.value;
            const voces = speechSynthesis.getVoices();
            config.voz = voces.find(v => v.name === nombreVoz) || null;
            alert('Configuración guardada.');
        }

        // ====================== INICIALIZACIÓN ======================
        window.onload = () => {
            const ancho = Math.min(window.innerWidth * 0.9, 280);
            canvas.width = ancho;
            canvas.height = ancho;
            dibujarCara();
            document.getElementById('rate').value = config.rate;
            document.getElementById('pitch').value = config.pitch;
            document.getElementById('umbralPos').value = config.umbralPositivo;

            cargarVoces();
            speechSynthesis.onvoiceschanged = cargarVoces;

            const aviso = document.getElementById('aviso-unico');
            if (aviso) {
                setTimeout(() => { aviso.style.display = 'none'; }, 8000);
            }

            // Arrancar bucle de animación para transiciones suaves
            requestAnimationFrame(loopAnimacion);
        };
    </script>
</body>
</html>
